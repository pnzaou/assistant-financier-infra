# Point 4h — Déploiement automatisé des livrables sur Kubernetes.
#
# Deux façons de le déclencher :
#
#   1. `repository_dispatch` — les CI du client et du serveur appellent ce
#      workflow après avoir publié leur image, en passant le sha à déployer.
#      C'est le mode nominal.
#   2. `workflow_dispatch` — depuis l'onglet Actions, pour rejouer un
#      déploiement ou revenir à une version antérieure.
#
# Le rollback ne passe pas par ce workflow : `helm rollback` est plus direct
# (voir README).
name: Déploiement

on:
  workflow_dispatch:
    inputs:
      environnement:
        description: "Environnement cible"
        required: true
        type: choice
        options: [staging, production]
        default: staging
      tag_serveur:
        description: "Tag de l'image serveur (ex. sha-a1b2c3d). Laisser VIDE conserve le tag actuellement déployé."
        required: false
        default: ""
      tag_client:
        description: "Tag de l'image client. Laisser VIDE conserve le tag actuellement déployé."
        required: false
        default: ""
  repository_dispatch:
    types: [deployer]

concurrency:
  # Deux `helm upgrade` concurrents sur la même release échouent sur
  # « another operation is in progress ». On sérialise par environnement.
  group: deploiement-${{ github.event.inputs.environnement || github.event.client_payload.environnement || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deployer:
    name: Déployer
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environnement || github.event.client_payload.environnement || 'staging' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Résolution de l'environnement
        id: env
        run: |
          # Les deux déclencheurs ne rangent pas leurs entrées au même endroit.
          ENV="${{ github.event.inputs.environnement || github.event.client_payload.environnement || 'staging' }}"
          echo "environnement=$ENV" >> "$GITHUB_OUTPUT"
          echo "→ environnement : $ENV"

      # OIDC : GitHub échange le jeton du job contre un jeton Azure éphémère.
      # Aucun secret client stocké — une clé qui fuite donnerait un accès
      # permanent à l'abonnement.
      - name: Authentification Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Accès au cluster
        run: |
          az aks get-credentials \
            --resource-group "${{ secrets.GROUPE_RESSOURCES }}" \
            --name "${{ secrets.NOM_CLUSTER }}" \
            --overwrite-existing

      - name: Installation de Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      # Chaque dépôt applicatif ne connaît QUE son propre sha : la CI du serveur
      # envoie `tag_serveur`, celle du client `tag_client`. Le tag absent ne doit
      # surtout pas retomber sur une valeur par défaut mouvante comme `develop` :
      #
      #   - le manifeste Helm serait inchangé (`:develop` → `:develop`), donc
      #     AUCUN rollout ne partirait ;
      #   - et avec `imagePullPolicy: IfNotPresent`, le nœud réutiliserait de
      #     toute façon l'image `develop` déjà en cache.
      #
      # Le composant concerné resterait donc sur l'ancien code, sans la moindre
      # erreur nulle part. On relit ici le tag RÉELLEMENT déployé et on le
      # reconduit : « déploie mon nouveau sha, laisse l'autre composant tel quel ».
      - name: Résolution des tags d'images
        id: params
        env:
          ENVIRONNEMENT: ${{ steps.env.outputs.environnement }}
          TAG_SRV_DEMANDE: ${{ github.event.inputs.tag_serveur || github.event.client_payload.tag_serveur }}
          TAG_CLI_DEMANDE: ${{ github.event.inputs.tag_client || github.event.client_payload.tag_client }}
        run: |
          # Lit le tag en service pour un composant donné. On sélectionne par
          # LABEL et non par nom : le nom complet dépend du nom de la release,
          # le label `component` est stable quoi qu'il arrive.
          # Silencieux et tolérant : au tout premier déploiement, rien n'existe.
          tag_en_service() {
            kubectl get deployment \
              -n "$ENVIRONNEMENT" \
              -l "app.kubernetes.io/component=$1" \
              -o jsonpath='{.items[0].spec.template.spec.containers[0].image}' 2>/dev/null \
              | sed 's/.*://'
          }

          TAG_SRV="$TAG_SRV_DEMANDE"
          if [ -z "$TAG_SRV" ]; then
            TAG_SRV="$(tag_en_service serveur)"
            if [ -n "$TAG_SRV" ]; then
              echo "serveur : non fourni → on reconduit le tag en service ($TAG_SRV)"
            else
              TAG_SRV="develop"
              echo "serveur : non fourni et rien en service → premier déploiement, tag develop"
            fi
          fi

          TAG_CLI="$TAG_CLI_DEMANDE"
          if [ -z "$TAG_CLI" ]; then
            TAG_CLI="$(tag_en_service client)"
            if [ -n "$TAG_CLI" ]; then
              echo "client : non fourni → on reconduit le tag en service ($TAG_CLI)"
            else
              TAG_CLI="develop"
              echo "client : non fourni et rien en service → premier déploiement, tag develop"
            fi
          fi

          {
            echo "tag_serveur=$TAG_SRV"
            echo "tag_client=$TAG_CLI"
          } >> "$GITHUB_OUTPUT"
          echo "→ $ENVIRONNEMENT : serveur=$TAG_SRV client=$TAG_CLI"

      - name: Déploiement
        env:
          ENVIRONNEMENT: ${{ steps.env.outputs.environnement }}
          TAG_SERVEUR: ${{ steps.params.outputs.tag_serveur }}
          TAG_CLIENT: ${{ steps.params.outputs.tag_client }}
        run: |
          helm upgrade --install assistant-financier ./helm/assistant-financier \
            --namespace "$ENVIRONNEMENT" \
            --values "./helm/assistant-financier/values-$ENVIRONNEMENT.yaml" \
            --set serveur.image.tag="$TAG_SERVEUR" \
            --set client.image.tag="$TAG_CLIENT" \
            --set secrets.jwtClePrivee="${{ secrets.JWT_CLE_PRIVEE }}" \
            --set secrets.jwtClePublique="${{ secrets.JWT_CLE_PUBLIQUE }}" \
            --set secrets.cookieSecret="${{ secrets.COOKIE_SECRET }}" \
            --set secrets.resendApiKey="${{ secrets.RESEND_API_KEY }}" \
            --set postgres.motDePasse="${{ secrets.POSTGRES_MOT_DE_PASSE }}" \
            --atomic \
            --wait \
            --timeout 10m
          # --atomic : en cas d'échec, Helm restaure automatiquement la
          # version précédente. Sans lui, un déploiement raté laisserait la
          # release à moitié appliquée.

      - name: État du déploiement
        if: always()
        env:
          ENVIRONNEMENT: ${{ steps.env.outputs.environnement }}
        run: |
          {
            echo "## Déploiement — $ENVIRONNEMENT"
            echo '```'
            helm status assistant-financier -n "$ENVIRONNEMENT" 2>&1 | head -30
            echo '```'
            echo '### Pods'
            echo '```'
            kubectl get pods -n "$ENVIRONNEMENT" -o wide 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Journaux du Job de migration en cas d'échec
        if: failure()
        env:
          ENVIRONNEMENT: ${{ steps.env.outputs.environnement }}
        run: |
          # Cause d'échec la plus fréquente : une migration Prisma qui casse.
          kubectl logs -n "$ENVIRONNEMENT" \
            -l app.kubernetes.io/component=migration \
            --tail=100 --all-containers 2>&1 || echo "Aucun Job de migration trouvé."
