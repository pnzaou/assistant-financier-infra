{{- if .Values.ingress.active }}
{{/*
  Un seul point d'entrée public, qui route par chemin :

    /api/*    → API Express
    /health   → API Express (sonde publique)
    /*        → front nginx

  Front et API partagent ainsi la même origine. Deux conséquences directes :
  le CORS devient inutile en production, et les cookies de session sont
  envoyés sans configuration cross-site particulière.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "af.nomComplet" . }}
  labels:
    {{- include "af.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.ingress.ipStatique }}
    # Adresse IP globale réservée : sans elle, l'IP change à chaque
    # recréation de l'Ingress et l'enregistrement DNS devient caduc.
    kubernetes.io/ingress.global-static-ip-name: {{ .Values.ingress.ipStatique | quote }}
    {{- end }}
    {{- if .Values.ingress.tls.active }}
    networking.gke.io/managed-certificates: {{ .Values.ingress.tls.nomCertificatGere | quote }}
    kubernetes.io/ingress.allow-http: "false"
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    # `host` est placé APRÈS `http` volontairement : l'ordre des clés d'un
    # mapping YAML est sans importance, et cette forme évite d'avoir à
    # dupliquer tout le bloc `paths` selon que le nom d'hôte est défini ou non.
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "af.nomComplet" . }}-serveur
                port:
                  number: {{ .Values.serveur.port }}
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: {{ include "af.nomComplet" . }}-serveur
                port:
                  number: {{ .Values.serveur.port }}
          # Route attrape-tout, déclarée en dernier. L'Ingress GCE évalue de
          # toute façon du chemin le plus spécifique au plus général, mais cet
          # ordre rend le fichier lisible.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "af.nomComplet" . }}-client
                port:
                  number: 80
      {{- if .Values.ingress.hote }}
      host: {{ .Values.ingress.hote | quote }}
      {{- end }}
{{- end }}
