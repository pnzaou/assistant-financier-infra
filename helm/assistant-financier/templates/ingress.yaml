{{- if .Values.ingress.active }}
{{/*
  Un seul point d'entrée public, qui route par chemin :

    /api/*    → API Express
    /health   → API Express (sonde publique)
    /*        → front nginx

  Front et API partagent ainsi la même origine. Deux conséquences directes :
  le CORS devient inutile en production, et les cookies de session sont
  envoyés sans configuration cross-site particulière.

  Aucune annotation spécifique à un fournisseur n'est codée en dur ici : ce
  qui dépend du contrôleur passe par `ingress.annotations`, pour que le même
  chart fonctionne derrière nginx (AKS), GCE (GKE) ou ALB (EKS).
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "af.nomComplet" . }}
  labels:
    {{- include "af.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if and .Values.ingress.tls.active .Values.ingress.tls.nomSecret }}
  tls:
    - secretName: {{ .Values.ingress.tls.nomSecret }}
      {{- if .Values.ingress.hote }}
      hosts:
        - {{ .Values.ingress.hote | quote }}
      {{- end }}
  {{- end }}
  rules:
    # `host` est placé APRÈS `http` volontairement : l'ordre des clés d'un
    # mapping YAML est sans importance, et cette forme évite d'avoir à
    # dupliquer tout le bloc `paths` selon que le nom d'hôte est défini ou non.
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "af.nomComplet" . }}-serveur
                port:
                  number: {{ .Values.serveur.port }}
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: {{ include "af.nomComplet" . }}-serveur
                port:
                  number: {{ .Values.serveur.port }}
          # Route attrape-tout, déclarée en dernier. nginx comme GCE évaluent
          # du chemin le plus spécifique au plus général, mais cet ordre rend
          # le fichier lisible.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "af.nomComplet" . }}-client
                port:
                  number: 80
      {{- if .Values.ingress.hote }}
      host: {{ .Values.ingress.hote | quote }}
      {{- end }}
{{- end }}
