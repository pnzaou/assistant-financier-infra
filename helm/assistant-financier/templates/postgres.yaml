{{- if .Values.postgres.active }}
{{/*
  PostgreSQL en StatefulSet, mono-replica.

  À n'utiliser que pour staging et pour la démo : un seul replica, pas de
  réplication, pas de sauvegarde. Si le disque est perdu, les données le sont
  aussi. Pour une vraie production, remplacer par Cloud SQL (ou l'opérateur
  CloudNativePG) et mettre postgres.active à false.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "af.hotePostgres" . }}
  labels:
    {{- include "af.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  annotations:
    # PostgreSQL doit exister AVANT le Job de migration, qui est lui-même un
    # hook `pre-install`. Or les hooks s'exécutent avant la phase normale : en
    # laissant la base dans cette phase, le Job attendait une base qui n'était
    # créée qu'après lui, et expirait au bout de son délai maximal.
    #
    # `pre-install` seulement, PAS `pre-upgrade` : la base est créée une fois,
    # à l'installation, puis laissée intacte. Un `pre-upgrade` la recréerait à
    # chaque déploiement, coupant le service à chaque fois.
    #
    # Poids -5 : après les secrets (-10), avant le Job de migration (0).
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  # Service « headless » : chaque pod du StatefulSet obtient une entrée DNS
  # stable, ce dont il a besoin pour garder son identité.
  clusterIP: None
  ports:
    - port: 5432
      targetPort: postgres
      name: postgres
  selector:
    {{- include "af.selecteurs" . | nindent 4 }}
    app.kubernetes.io/component: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "af.hotePostgres" . }}
  labels:
    {{- include "af.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  annotations:
    # Mêmes annotations que le Service ci-dessus, et pour la même raison.
    #
    # Conséquence à connaître : une ressource de type hook n'est pas suivie
    # dans le manifeste de la release. `helm uninstall` ne supprimera donc ni
    # ce StatefulSet ni son volume — il faut les retirer à la main. C'est aussi
    # ce qui protège les données d'une suppression accidentelle.
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  serviceName: {{ include "af.hotePostgres" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "af.selecteurs" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "af.selecteurs" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      {{- include "af.ordonnancement" . | nindent 6 }}
      securityContext:
        # UID de l'utilisateur postgres dans l'image alpine. fsGroup fait
        # appartenir le volume à ce groupe, sinon le conteneur ne peut pas
        # écrire dans son propre répertoire de données.
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.utilisateur | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.base | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "af.nomSecretPostgres" . }}
                  key: motDePasse
            # L'image Postgres refuse d'initialiser dans un répertoire non
            # vide : or un volume GCE monté contient déjà lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: donnees
              mountPath: /var/lib/postgresql/data
          # `pg_isready` seul répond OK dès l'écoute du socket, avant que la
          # base ne soit interrogeable : on exécute une vraie requête.
          readinessProbe:
            exec:
              command:
                ["sh", "-c", "pg_isready -U {{ .Values.postgres.utilisateur }} -d {{ .Values.postgres.base }}"]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                ["sh", "-c", "pg_isready -U {{ .Values.postgres.utilisateur }} -d {{ .Values.postgres.base }}"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.postgres.ressources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: donnees
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.postgres.stockage.classe }}
        resources:
          requests:
            storage: {{ .Values.postgres.stockage.taille }}
{{- end }}
