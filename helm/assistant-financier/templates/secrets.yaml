{{/*
  Secrets applicatifs et mot de passe Postgres.

  Ces deux Secrets portent les annotations de hook Helm à dessein. Le Job de
  migration (migration-job.yaml) est un hook `pre-install`, or les hooks
  s'exécutent AVANT la phase normale d'installation : sans ces annotations,
  le Job démarrerait à la toute première installation en référençant des
  Secrets qui n'existent pas encore, et resterait bloqué en
  CreateContainerConfigError.

  `hook-weight: -10` les place avant le Job (poids 0).
  `before-hook-creation` supprime l'ancienne version avant d'en créer une
  nouvelle, sans effacer le Secret après coup : les pods de la phase normale
  peuvent donc s'y référer.

  Conséquence à connaître : les ressources de type hook ne sont pas suivies
  dans le manifeste de la release. `helm uninstall` ne les supprimera pas,
  il faut les retirer à la main.
*/}}
{{- if not .Values.secrets.secretExistant }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "af.nomSecret" . }}
  labels:
    {{- include "af.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  {{- if not .Values.secrets.jwtClePrivee }}
  {{- fail "secrets.jwtClePrivee est obligatoire. Générer la paire avec `node scripts/generer-cles.js` dans le repo serveur, puis la passer par --set-file ou renseigner secrets.secretExistant." }}
  {{- end }}
  jwtClePrivee: {{ .Values.secrets.jwtClePrivee | quote }}
  jwtClePublique: {{ required "secrets.jwtClePublique est obligatoire." .Values.secrets.jwtClePublique | quote }}
  cookieSecret: {{ required "secrets.cookieSecret est obligatoire." .Values.secrets.cookieSecret | quote }}
  resendApiKey: {{ .Values.secrets.resendApiKey | quote }}
  {{- if not .Values.postgres.active }}
  {{/* Base externe : l'URL complète vient d'ici (voir af.envServeur). */}}
  databaseUrl: {{ required "secrets.databaseUrl est obligatoire quand postgres.active vaut false." .Values.secrets.databaseUrl | quote }}
  {{- end }}
{{- end }}

{{- if and .Values.postgres.active (not .Values.postgres.secretExistant) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "af.nomSecretPostgres" . }}
  labels:
    {{- include "af.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  motDePasse: {{ required "postgres.motDePasse est obligatoire (ou renseigner postgres.secretExistant)." .Values.postgres.motDePasse | quote }}
{{- end }}
