# Surcharges de l'environnement de STAGING (namespace `staging`).
#
#   helm upgrade --install assistant-financier ./helm/assistant-financier \
#     --namespace staging \
#     --values ./helm/assistant-financier/values-staging.yaml \
#     --set serveur.image.tag=sha-<commit> \
#     --set client.image.tag=sha-<commit>

serveur:
  image:
    tag: develop
  autoscaling:
    active: true
    minReplicas: 1
    maxReplicas: 3
  # `limits.cpu` explicite : le ResourceQuota du namespace le rend obligatoire.
  # 3 replicas max × 400m = 1,2 CPU, + client 300m + postgres 400m = 1,9 CPU,
  # sous le plafond de 2 CPU du quota staging.
  ressources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 400m
      memory: 512Mi

client:
  image:
    tag: develop
  autoscaling:
    active: true
    minReplicas: 1
    maxReplicas: 2

postgres:
  active: true
  stockage:
    taille: 5Gi
    classe: managed-csi

config:
  nodeEnv: production
  # ORIGINE COMPLÈTE, jamais un chemin relatif.
  #
  # Le client construit ses appels ainsi : `${API_URL}/api/v1/...`, et
  # src/lib/config.ts résout API_URL avec `||`. Une chaîne vide serait donc
  # traitée comme « non défini » et retomberait sur http://localhost:5000 ;
  # une valeur "/api" produirait "/api/api/v1/...". Dans les deux cas le
  # front n'atteindrait jamais l'API.
  #
  # IP publique du contrôleur d'entrée nginx, relevée après création du cluster.
  # Front et API partagent cette origine : l'Ingress route /api vers l'API et
  # le reste vers nginx. En HTTP pour l'instant — un nom de domaine et un
  # certificat TLS seraient la suite logique.
  urlApiPubliqueClient: "http://4.176.104.163"
  urlsClient: "http://4.176.104.163"

ingress:
  active: true
  # Contrôleur nginx géré par AKS (bloc web_app_routing du Terraform).
  className: webapprouting.kubernetes.azure.com
  hote: ""
  tls:
    active: false

migrations:
  active: true
  # Vrai uniquement au premier déploiement d'un environnement neuf.
  seed: true
